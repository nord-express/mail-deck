<!DOCTYPE html>
<!-- The welcome page at a width headless Chrome will not give a window (it keeps 500px at least):
     a narrow window is the page in a frame that wide. ?w= is the width, ?q= the page's query. -->
<html>
<head>
  <meta charset="utf-8">
  <title>welcome frame</title>
</head>
<body style="margin: 0">
  <script>
    const p = new URLSearchParams(location.search);
    const f = document.createElement('iframe');
    f.style.cssText = `width: ${Number(p.get('w'))}px; height: 900px; border: 0`;
    f.src = '/__welcome.html?' + p.get('q');
    document.body.append(f);
  </script>
</body>
</html>
