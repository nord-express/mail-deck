<!doctype html>
<!--
  Mail Deck · small promo tile, 440×280 (Chrome Web Store search and category pages).
  Google's rules: no text beyond the name (the tile is the same in every language), saturated
  colours that fill the tile, clear edges on a light grey page, readable at half size, the brand
  first and no plain screenshot. So: the icon and the name on the left; on the right the deck
  dealt as in the icon, its front card a drawing of the panel: inboxes in their colours, a
  sign-in code, an attachment, a summary. Nothing in it is a word.
  Render: python3 tools/promo/render.py
-->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Schibsted Grotesk'; font-weight: 400 800; src: url(../../docs/fonts/schibsted-grotesk.woff2) format('woff2'); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
body {
  position: relative;
  font-family: 'Schibsted Grotesk', sans-serif;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(70% 90% at 12% 8%, #6d78ff 0%, rgba(109, 120, 255, 0) 70%),
    radial-gradient(60% 80% at 100% 100%, #1e1f86 0%, rgba(30, 31, 134, 0) 75%),
    linear-gradient(140deg, #4a55ec 0%, #3a40d0 45%, #2c2cab 100%);
}
/* soft light behind the deck */
body::before {
  content: ''; position: absolute; left: 190px; top: 20px; width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0));
}

.brand { position: absolute; left: 30px; top: 0; bottom: 0; width: 170px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
.plate { position: relative; width: 72px; height: 72px; border-radius: 20px; background: #fff; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(10, 12, 60, .3); }
.plate img { width: 62px; height: 62px; object-view-box: inset(8.5px 8.5px 7.5px 7.5px); }
/* the toolbar button's count of unread mail */
.plate em { position: absolute; right: -9px; top: -9px; min-width: 26px; height: 26px; border-radius: 13px; background: #e5484d; color: #fff; box-shadow: 0 0 0 3px #fff, 0 4px 10px rgba(10, 12, 60, .3); font: 800 15px/26px 'Schibsted Grotesk', sans-serif; font-style: normal; text-align: center; }
.brand b { display: block; margin-top: 16px; color: #fff; font-size: 50px; font-weight: 800; line-height: .94; letter-spacing: -.025em; text-shadow: 0 2px 12px rgba(10, 12, 60, .25); }
.dots { display: flex; gap: 6px; margin-top: 16px; padding: 5px 7px; border-radius: 11px; background: rgba(255, 255, 255, .92); }
.dots i { width: 10px; height: 10px; border-radius: 50%; }

/* the deck: two inbox cards fanned behind the panel */
.card { position: absolute; left: 212px; top: 24px; width: 184px; height: 232px; border-radius: 20px; }
.card.orange { background: linear-gradient(160deg, #f7ae5c, #e88a2e 50%, #d1721a); transform: translate(30px, 6px) rotate(12deg); box-shadow: 0 10px 24px rgba(10, 12, 60, .3); }
.card.green { background: linear-gradient(160deg, #34cc8f, #17a066 50%, #0e8552); transform: translate(15px, 3px) rotate(6deg); box-shadow: 0 10px 24px rgba(10, 12, 60, .3); }
.panel { background: #fff; box-shadow: 0 14px 30px rgba(10, 12, 60, .38); padding: 13px 12px 0; overflow: hidden; }

/* the panel, drawn: bars for words */
.bar { display: block; height: 6px; border-radius: 3px; background: #d9dce3; }
.bar.ink { background: #2a2d36; height: 7px; }
.top { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.top .bar.ink { width: 52px; height: 9px; border-radius: 4px; }
.top .grow { flex: 1; }
.top svg { width: 13px; height: 13px; }
.inbox { display: flex; align-items: center; gap: 6px; margin: 2px 0 6px; }
.inbox i { width: 8px; height: 8px; border-radius: 50%; }
.inbox .bar { width: 78px; background: #8d929e; height: 6px; }
.inbox em { margin-left: auto; min-width: 17px; height: 15px; border-radius: 8px; color: #fff; font: 800 10px/15px 'Schibsted Grotesk', sans-serif; text-align: center; font-style: normal; }
.mail { display: flex; gap: 8px; padding: 8px 0 9px; border-top: 1px solid #eceef2; }
.mail .who { flex: none; width: 22px; height: 22px; border-radius: 50%; color: #fff; font: 800 11px/22px 'Schibsted Grotesk', sans-serif; text-align: center; }
.mail .lines { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.row { display: flex; align-items: center; gap: 5px; }
.code { font: 800 9px/14px ui-monospace, Menlo, monospace; letter-spacing: .04em; color: #1d2030; background: #f1f2f5; border: 1px solid #dfe2e8; border-radius: 4px; padding: 0 4px; }
.pdf { font: 800 7.5px/12px 'Schibsted Grotesk', sans-serif; color: #fff; background: #d93a3a; border-radius: 3px; padding: 0 4px; letter-spacing: .03em; }
.att { display: flex; align-items: center; gap: 4px; height: 17px; border: 1px solid #e3e5ea; border-radius: 5px; padding: 0 5px 0 3px; }
.att .bar { width: 34px; height: 5px; }
.gist { margin-top: 2px; border-radius: 7px; background: linear-gradient(135deg, #eef0ff, #f4ecff); padding: 6px 7px; display: flex; gap: 6px; }
.gist svg { flex: none; width: 12px; height: 12px; margin-top: -1px; }
.gist div { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.gist .bar { background: #b9c0f7; height: 5px; }
</style></head><body>

<div class="brand">
  <span class="plate"><img src="../icon/master.svg" alt=""><em>5</em></span>
  <b>Mail<br>Deck</b>
  <div class="dots"><i style="background:#3567e6"></i><i style="background:#17a066"></i><i style="background:#e88a2e"></i><i style="background:#e5484d"></i><i style="background:#8b5cf6"></i></div>
</div>

<div class="card orange"></div>
<div class="card green"></div>
<div class="card panel">
  <div class="top">
    <span class="bar ink"></span><span class="grow"></span>
    <svg viewBox="0 0 16 16"><path d="M8 1.5l1.6 4.2 4.4 1.6-4.4 1.6L8 13.1 6.4 8.9 2 7.3l4.4-1.6z" fill="#5b67f0"/></svg>
    <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.3" fill="none" stroke="#9aa0ad" stroke-width="1.8"/><path d="M10.2 10.2l3.3 3.3" stroke="#9aa0ad" stroke-width="1.8" stroke-linecap="round"/></svg>
  </div>

  <div class="inbox"><i style="background:#3567e6"></i><span class="bar"></span><em style="background:#3567e6">3</em></div>
  <div class="mail">
    <span class="who" style="background:#17a066">F</span>
    <div class="lines">
      <span class="bar ink" style="width:58%"></span>
      <div class="row"><span class="code">482913</span><span class="bar" style="flex:1"></span></div>
    </div>
  </div>
  <div class="mail">
    <span class="who" style="background:#8b5cf6">M</span>
    <div class="lines">
      <span class="bar ink" style="width:46%"></span>
      <div class="row"><span class="att"><span class="pdf">PDF</span><span class="bar"></span></span></div>
    </div>
  </div>

  <div class="inbox"><i style="background:#17a066"></i><span class="bar" style="width:64px"></span><em style="background:#17a066">2</em></div>
  <div class="mail">
    <span class="who" style="background:#e88a2e">A</span>
    <div class="lines">
      <span class="bar ink" style="width:52%"></span>
      <div class="gist">
        <svg viewBox="0 0 16 16"><path d="M8 1.5l1.6 4.2 4.4 1.6-4.4 1.6L8 13.1 6.4 8.9 2 7.3l4.4-1.6z" fill="#6a5cf0"/></svg>
        <div><span class="bar" style="width:100%"></span><span class="bar" style="width:70%"></span></div>
      </div>
    </div>
  </div>
</div>

</body></html>
