<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mail Deck</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app" id="app">
    <main class="main">
      <header class="bar">
        <div class="heading">
          <h1 data-i18n="inbox">Inbox</h1>
          <p class="sub" id="sub"></p>
        </div>
        <div class="tools" id="tools"></div>
      </header>
      <form class="search" id="search" role="search" hidden>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search">
      </form>
      <nav class="chips" id="chips" aria-label="Mailboxes" data-i18n-label="mailboxes"></nav>
      <div class="list" id="list"></div>

      <!-- the assistant: a request in plain words about the mail, and what came of it -->
      <section class="assist" id="assist" tabindex="-1" aria-label="Assistant" data-i18n-label="assistant">
        <header class="bar assist-bar" id="assist-bar"></header>
        <div class="assist-body" id="assist-body"></div>
        <form class="assist-ask" id="assist-ask">
          <textarea id="assist-input" rows="1" autocomplete="off" enterkeyhint="send" aria-label="Ask" data-i18n-label="ask"></textarea>
          <button class="icon-btn send" id="assist-send" type="submit"></button>
        </form>
      </section>

      <section class="reader" id="reader" tabindex="-1" aria-label="Message" data-i18n-label="message">
        <header class="bar reader-bar" id="reader-bar"></header>
        <div class="reader-card">
        <div class="reader-head">
          <p class="reader-account" id="reader-account"><span class="dot"></span><span></span></p>
          <h2 id="reader-subject"></h2>
          <div class="reader-from">
            <span id="reader-avatar"></span>
            <div class="who">
              <span class="name" id="reader-name"></span>
              <span class="addr" id="reader-addr"></span>
            </div>
            <time id="reader-date"></time>
          </div>
          <!-- the thread's files, where they cannot be missed -->
          <div class="reader-files" id="reader-files" hidden></div>
        </div>
        <!-- the assistant's buttons for the open mail, and its summary, reply, answer or translation: over the message, not in it -->
        <div class="reader-ai" id="reader-ai" hidden></div>
        <section class="ai-card" id="ai-card" aria-labelledby="ai-title" aria-live="polite" hidden></section>
        <section class="ai-card ai-tool" id="ai-tool" aria-live="polite" hidden></section>
        <div class="reader-body">
          <div class="progress"></div>
          <iframe id="body" src="body/index.html" title="Message body" data-i18n-label="messageBody"></iframe>
        </div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <!-- a button's name and its key; the button's own label is what a screen reader says -->
  <div class="tip" id="tip" aria-hidden="true"></div>
  <!-- what the search found, said to a screen reader -->
  <p class="sr" id="status" role="status"></p>

  <script src="/core/services/yahoo.js"></script>
  <script src="/core/services/aol.js"></script>
  <script src="/core/services/proton.js"></script>
  <script src="/core/services/yandex.js"></script>
  <script src="/core/services/mailru.js"></script>
  <script src="/core/utils/resolved.js"></script>
  <script src="/core/utils/remind.js"></script>
  <script src="/core/utils/code.js"></script>
  <script src="gmail.js"></script>
  <script src="index.js"></script>
</body>
</html>
